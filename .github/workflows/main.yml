name: Build CustomDeathMessage

on:
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Descargar Nukkit
        run: |
          mkdir -p libs
          wget -O libs/nukkit.jar https://repo.opencollab.dev/maven-snapshots/cn/nukkit/nukkit/1.0-SNAPSHOT/nukkit-1.0-20220619.011414-1079.jar
      - name: Build plugin
        run: |
          mkdir -p bin
          find src/main/java/org/_2b2tmcpe/CustomDeathMessage -name "*.java" > sources.txt
          find src/main/java/org/_2b2tmcpe/CustomDeathMessage/Listener -name "*.java" >> sources.txt
          javac -cp "libs/nukkit.jar" -d bin @sources.txt
          cp src/main/resources/config.yml bin/
          jar cf CustomDeathMessage.jar -C bin .

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: CustomDeathMessage-JAR
          path: CustomDeathMessage.jar
